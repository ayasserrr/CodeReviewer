# Deep Review configuration — the single source of truth for WHAT the
# deep-review agents look for. Settings.DEEP_REVIEW_CONFIG_PATH
# (src/config/settings.py) defaults to this file (same bundled-asset pattern
# as ruff.toml / pyrightconfig.json / gitleaks).
#
# Editing this file changes the review without touching code:
#   * [[categories]]      -> one specialist subagent per enabled category,
#                            all run in parallel; the order here is the
#                            section order in the final report.
#   * [[security_kpis]]   -> the mandatory security checklist the `security`
#                            specialist must assess one by one (report §0.1).
#   * [static_analysis]   -> which specialist owns (triages) which tool's
#                            findings, so every static finding is judged by
#                            exactly one agent and never twice.
#
# The content hash of this file is part of the review cache key, so any edit
# here automatically invalidates previously cached reports.

[review]
# Suffix of the report H1: "<repo name> — <title_suffix>".
title_suffix = "Full Engineering Review"
# The reference report format is findings-only (what is wrong, the evidence,
# the impact). Flip to true to also ask agents for a remediation line.
include_remediation = false
# Ordered most -> least severe. Used for validation, sorting and the legend.
severity_levels = ["Critical", "High", "Medium", "Low"]
# Findings at these severities get an independent verification pass by a
# second agent (the rest are kept as reported). Verification is what keeps
# false positives out of the top of the report.
verify_severities = ["Critical", "High", "Medium", "Low"]
# Hard cap per category so one noisy specialist can't drown the report.
max_findings_per_category = 30
# Findings the specialist itself rated below this confidence are dropped.
# One of: low | medium | high.
min_confidence = "medium"

[static_analysis]
# tool -> owning category id. The owner triages every finding from that tool
# (true_positive / false_positive / low_value). Every specialist can still
# *read* all static findings as context.
[static_analysis.owners]
ruff = "maintainability"
vulture = "maintainability"
jscpd = "maintainability"
radon = "maintainability"
lizard = "maintainability"
pyright = "correctness"
bandit = "security"
semgrep = "security"
gitleaks = "secrets"
pip_audit = "dependencies"

# ---------------------------------------------------------------------------
# Review categories (one specialist agent each, run concurrently)
# effort (1-5): relative run length, measured on real runs. Heavier lanes are
# launched first so they never wait behind short ones for a free agent slot.
# ---------------------------------------------------------------------------

[[categories]]
id = "integration"
title = "Integration & Configuration"
code = "INT"
effort = 3
enabled = true
focus = """
Questions for THIS system: will it work when deployed somewhere other than the
developer's machine, and do its parts agree with each other?
- Configuration: where every setting comes from (env, files, defaults), whether one
  validated settings object exists or values are read ad hoc with inline defaults,
  keys whose defaults disagree between modules, the same key reused for different
  purposes, templates (.env.example) that disagree with what the code reads.
- Externally visible URLs and hosts: links, callbacks and redirects the system hands to
  users or other services — follow each value to where it is USED; a default on
  localhost/a dev host there breaks the feature for every real user.
- Frontend <-> backend contract (client_calls.md): calls to routes that do not exist,
  request/response shapes that drifted, base-URL/proxy wiring that only works in dev,
  CORS vs the origins the system is really served from.
- Credentials in transit: API keys shipped to the browser, secrets accepted in query
  strings (they end up in logs, history, referrers).
- Outbound calls: timeouts, retries of non-idempotent requests, error handling that hides
  failures, global side effects inside HTTP helpers.
- API contract of the backend itself: request bodies taken as raw dict/Request.json() instead
  of validated schemas, status codes that lie (200 with an error body, 500 for bad input, 404
  vs 403 leaking existence), inconsistent error shapes across routers, breaking changes to
  documented routes, POSTs that create money/jobs/messages with no idempotency key.
- Operational scripts in your scope (migrations, bootstrap/entrypoint, shell, SQL,
  Makefile): run each one in your head against an EXISTING production environment and
  a second time — does it mark schema as applied without applying it, drop or reset
  data, depend on the developer's paths, or silently continue after a failed step?
- Start from env_map.md and client_calls.md; everything else from reading the code.
"""

[[categories]]
id = "security"
title = "Security & Authorization"
code = "SEC"
effort = 5
enabled = true
owns_security_kpis = true
focus = """
Think like an attacker who has read this code: who can reach what, as whom, with which input?
- Authorization: for every route that reads or changes data, who is the caller and how is
  that proven? Identity taken from client-controlled input (header, body, query) instead
  of a verified token; role checks that only test presence; object-level checks (IDOR) on
  every id-addressed resource; services that receive the caller's identity but query
  everything (a global dump).
- Injection and unsafe processing: SQL/NoSQL built from strings, command execution with
  untrusted args, path traversal through client filenames, SSRF, template/HTML/header
  injection, unsafe deserialization, eval/exec.
- Business-logic abuse: values the server should own but takes from the client (price,
  quantity, discount, status, owner, role — mass assignment through update schemas),
  negative or huge quantities, steps of a workflow that can be skipped or replayed,
  limits checked in the client only.
- Multi-tenant / multi-user isolation: every query and file path scoped to the caller's
  tenant/owner, including list, search, export, background jobs and caches.
- Server-side requests (SSRF) and inbound integrations: URLs, hosts or files fetched on a
  client's behalf; webhooks/callbacks accepted without a signature check or replay
  protection; redirects to request-supplied targets.
- Response over-exposure: ORM objects or dicts returned without a response schema (password
  hashes, internal flags, other users' fields leave the server), list endpoints returning
  every column of every row, errors echoing queries or internals.
- Model/agent features (when present): untrusted content fed to models that decide or
  act (prompt injection), model output rendered as HTML or executed, tools with write
  access driven by model output.
- Browser-facing security: CORS with credentials, security headers, cookie flags, CSRF.
- Data exposure and privacy: what personal or sensitive data the system stores and
  where it flows — third-party services that receive it (runtime_signals.md lists the
  processor SDKs), public file serving, logs, exports; audit trail of access; retention
  and deletion (including derived copies such as caches, indexes and embeddings).
- Walk route_map.md row by row (mounted sub-apps, shared-key-only routes, CLIENT-ASSERTED
  IDENTITY rows grouped by root cause); triage bandit/semgrep; report latent code as latent.
"""

[[categories]]
id = "auth"
title = "Authentication, Sessions & Token Lifecycle"
code = "AUTH"
effort = 3
enabled = true
focus = """
Can an attacker become someone else, stay someone after they should not, or guess their way in?
- Tokens and sessions: secret source and insecure defaults, algorithm pinning, expiry and
  clock handling, refresh rotation, token-type confusion, logout that does not revoke.
- Credential flows: password hashing and comparison, reset/OTP/verification flows (entropy,
  expiry, attempt limits, storage), account creation that skips verification, privilege
  escalation through self-service endpoints, API keys compared non-constant-time.
- Secrets and tokens generated with a non-cryptographic RNG (random, uuid1, time-based),
  predictable reset/verification links, sessions not rotated after login or privilege change.
- Abuse resistance: rate limiting and lockout on every AUTH ENTRY POINT (route_map.md),
  user enumeration through messages or timing.
- Fail-closed startup for auth-critical settings; client-side guards that render
  protected pages before auth completes.
"""

[[categories]]
id = "frontend"
title = "Frontend & Client Security"
code = "WEB"
effort = 2
# Off: the review is backend-first. Browser code is then only context (which routes it calls,
# what the backend hands it) and is in no lane's scope. Set true to review the client too.
enabled = false
focus = """
Only applicable if the repository contains a browser client. If not, record nothing and
say "not applicable".
- What the bundle exposes: credentials in public env vars (VITE_/NEXT_PUBLIC_/...),
  tokens in web storage, secrets in URLs.
- XSS sinks: raw HTML rendering (innerHTML, document.write, dangerouslySetInnerHTML,
  markdown with raw HTML, iframes with scripts + same-origin), especially of stored user
  or model-generated content; unvalidated URLs in href/src.
- Browser-built exports (spreadsheets/CSV) from stored values: formula injection.
- Auth flow in the client: guards, reactivity across tabs, logout leftovers.
- Transport helper: global side effects, blind retries of non-idempotent requests,
  missing timeouts, swallowed errors; contract drift with the backend (client_calls.md).
- Resilience: error boundaries, fragile asset paths, dev-only configuration.
"""

[[categories]]
id = "observability"
title = "Logging, Observability & Governance"
code = "OBS"
effort = 1
enabled = true
focus = """
If this system fails in production tonight, can the team see it, trace it and recover?
- Tracing: can one request be followed across the API, background work, external calls
  and the database (request/correlation ids propagated)?
- Logging: print() instead of logging in live code, missing levels/structure, swallowed
  exceptions, errors without context, secrets or personal data written to logs.
- Health: checks that report healthy without checking the dependencies the service needs.
- Metrics: latency, error rate, queue depth, external-call durations, cost accounting
  for metered APIs.
- Durability: failure information that vanishes on restart; backups and a restore path
  for the data the system owns (databases, local stores, uploaded files).
- runtime_signals.md counts print() per LIVE module and lists static health checks — cite
  live service code, not scripts, and give real counts.
"""

[[categories]]
id = "testing"
title = "Testing & CI"
code = "TST"
effort = 1
enabled = true
focus = """
What stops a regression from reaching production?
- The test suite: does it exist, and what does it actually exercise — units only, or the
  HTTP API, authentication/authorization, data mutation, file handling, the core
  business flows, the frontend<->backend contract? Name the critical routes and modules
  nothing exercises (your leads list them) instead of saying "no tests" in general.
- Tests that cannot fail (no assertions), hit live external services, or carry
  hard-coded credentials.
- CI/CD: does any pipeline run tests, lint, type checks and security/dependency scans
  before deploying, or does it only build and ship? Pipeline hygiene (sudo, curl | sh,
  secrets echoed into logs, mutable image tags, no image scan).
- Migrations: are schema changes applied and tested the way production runs them?
- runtime_signals.md lists the test files, which drive the API, the declared frameworks
  and every pipeline with its stages. These findings affect the deployed service even
  though the evidence is test and pipeline files.
"""

[[categories]]
id = "secrets"
title = "Environment & Secrets Handling"
code = "ENV"
effort = 1
enabled = true
focus = """
Where can a secret leak, and what happens when one is missing?
- Hard-coded credentials, keys, tokens and connection strings anywhere (source, config,
  docs, scripts, notebooks, tests); triage gitleaks.
- Insecure defaults for secrets, secrets too short, real values in example files, secrets
  exposed to browsers through public env prefixes.
- Startup validation: does the app refuse to boot without its required secrets and
  settings, or start on defaults/None and fail later or run insecurely?
- Configuration governance: duplicate keys whose effective value depends on load order
  (templates, deploy manifests), contradictory env files.
- Artifact governance: what the build and deploy ship — Dockerfiles copying the whole
  context without a .dockerignore for env files and data, committed archives, personal or
  customer documents stored in the tree, secrets written into containers at deploy.
- NEVER open real .env files — env_map.md lists their key names and value flags.
"""

[[categories]]
id = "performance"
title = "Performance & Scalability"
code = "PERF"
effort = 2
enabled = true
focus = """
What happens to THIS system under real load and real data growth, and with more than one instance?
- Event-loop blocking: sync I/O, CPU work, sync SDK/model calls or sleeps inside async
  request or job code (runtime_signals.md traces them through helper functions).
- Horizontal scaling: process-local state (caches, semaphores, locks, flags, queues,
  progress buses, local file or vector stores) — one grouped architectural finding
  listing every item; deployment topology that pins one instance because of it.
- Growth with data instead of with the request: unbounded reads and missing server-side
  pagination, whole collections reloaded or reprocessed per event (O(n) per event, O(n^2)
  overall), whole files rewritten per event, N+1 queries, missing indexes.
- External calls: timeouts, backoff, circuit breakers, bounded concurrency.
- Database usage: transactions held open across slow work (HTTP/model calls, file parsing)
  holding locks and pool connections; pool size vs workers x concurrency; per-request
  construction of heavy clients (HTTP, model, DB engines) instead of one shared instance.
- Memory: in-process caches, dicts or buffers keyed by user/session/job that only grow;
  whole files or result sets loaded into memory; connection pools sized for one worker.
- Startup: heavy resources loaded synchronously, clients built at import time, one failing
  dependency taking the whole service down.
- Use the dependency graph's fan-in for hot paths; architecture.md and runtime_signals.md
  hold the static leads.
"""

[[categories]]
id = "llm"
title = "AI/LLM Usage: Memory, Tokens & Cost"
code = "LLM"
effort = 2
enabled = true
focus = """
Only applicable if the repository calls LLM / embedding / ML model APIs. If it does not,
record nothing and say "not applicable".
Trace what the system actually sends to the model and what it costs:
- Memory: what does one conversational request send — is history persisted, resent, or
  absent? (A session id that nothing reads is dead plumbing.) Report the real behavior.
- Token growth inside ONE request: agent loops that append responses and tool outputs and
  resend the whole list each round; unbounded tool outputs; no input/context guard.
- Cost controls, as separate findings when missing: MEASUREMENT (tokens, model, duration
  captured per call), ATTRIBUTION (usage per user/session/job answerable), ENFORCEMENT
  (budgets or quotas applied).
- Robustness: clients built at import time, missing timeouts/retries, tool exceptions
  that break a stream, no structured-output validation.
- Duplicated model work: the same content embedded or sent twice, whole collections
  re-scored per event, prompts that grow with the size of the data.
- Automated decisions: when model output ranks, filters or decides about people or
  money, is there an evaluation set for its quality and a human review/override step?
- Untrusted input in prompts: record the cost/robustness angle here (security owns the exploit).
"""

[[categories]]
id = "inputs"
title = "Upload Governance & Input Controls"
code = "INP"
effort = 4
enabled = true
focus = """
Every way data enters this system — can it be abused to exhaust, corrupt or overload it?
- Enumerate every input path (uploads, imports, webhooks, media, free-text/chat, bulk
  endpoints) from route_map.md and the code, and for each: type validation by content
  (not client Content-Type/extension), size limits enforced before reading, filename
  handling, storage location.
- Parser and processor abuse: decompression bombs, entity expansion, documents whose cost
  is pages/frames/OCR rather than bytes, external programs run without timeouts
  (runtime_signals.md lists every subprocess call without one).
- Lifecycle governance: per-user quotas, job-creation caps, cancellation of running work,
  retry/backoff, recovery of stuck jobs/locks, cleanup of orphaned files, per-session
  buffers held in process memory.
- Request validation: unbounded strings/lists, missing length limits, client-supplied
  identifiers trusted as-is, rate limits on expensive endpoints.
Summarize several input paths as a markdown table (input path | type check | size limit |
other gaps) inside one summary finding. You own input governance even when security also
reports an exploit through the same code.
"""

[[categories]]
id = "correctness"
title = "Correctness & Data-Integrity Bugs"
code = "BUG"
effort = 4
enabled = true
# Deep multi-file tracing is where the base model stops at surface patterns:
# this lane's specialist runs on DEEP_REVIEW_JUDGE_MODEL.
strong_model = true
focus = """
Does THIS system produce correct results and keep its data consistent — not only when things go right?
- Start from what the system is for (AGENTS.md, entry points, the core business flows) and
  trace each core flow end to end through its callees: where data is transformed,
  stored, derived and presented.
- Logic errors: wrong conditions, off-by-one, error paths that leave bad state, exceptions
  swallowed so failures look like success, race conditions and double processing.
- Data integrity: values silently rewritten or "corrected", lossy or inconsistent
  normalization between code paths, the same data processed twice or in two different
  shapes, identifiers that can collide or whose shape is treated as meaning.
- Cleaning and normalization that destroys information: for every text/data cleaning,
  parsing or truncation step on a core flow, list what it removes or rewrites (emails,
  URLs, numbers, non-ASCII, case, whitespace, fields past a length) and check whether any
  LATER step — matching, deduplication, contact, scoring, display — needs what was lost.
- Check-then-act races: "if not exists: insert", read-modify-write counters and balances,
  uniqueness enforced in code but not by a database constraint; cascades that delete too
  much or leave orphans; retried operations (jobs, webhooks, client retries) that are not
  idempotent and apply twice.
- Results that lie: errors reported as success (HTTP 200 with an error body, empty list on
  failure), defaults substituted for missing data, cached values served after the source
  changed with no invalidation, unstable ordering under pagination.
- State: flags/locks/claims released only on the happy path (stuck after a crash or
  deploy), transactions with partial writes, missing rollbacks, sessions shared across
  tasks, naive vs aware datetimes, money as float.
- Async and ORM pitfalls: one AsyncSession/connection shared by concurrent tasks (gather,
  background work), lazy-loaded relationships touched after the session closed or in async
  code, sync ORM/drivers called inside async def, commits inside loops that leave half a
  batch written, exceptions in background tasks/schedulers that nobody observes.
- Parallel implementations of one operation (runtime_signals.md): diff them — copies that
  already disagree are correctness bugs.
- Entry points and scripts that cannot work as written; reliance on private library APIs.
- Triage pyright in bulk first (triage_static_rule); a type complaint is at most Low unless
  you show the runtime path that fails.
- Locks, "in progress" flags, claimed jobs and leases that live outside the process (DB row,
  file, cache key): what clears them if the process is killed or redeployed mid-work? A
  finally block does not run then; without an expiry, startup reset or owner check the
  resource stays stuck.
"""

[[categories]]
id = "maintainability"
title = "Dead Code, Duplication & Architecture"
code = "MNT"
effort = 4
enabled = true
focus = """
How hard is it for the team to change THIS system safely?
- Dead code: modules no entry point reaches (reachability.md) as grouped findings sized in
  lines — prove each with find_references (routes, registries, callbacks, string-based use
  count as use). Endpoints no client calls are dead only if nothing else uses them and
  nothing documents them (route rows marked DOCUMENTED are external contracts).
- Duplication that matters: parallel implementations of one operation and copies that have
  already diverged (triage jscpd; boilerplate is low_value).
- Architecture: layering violations and import cycles between top-level packages, god
  modules, several code generations coexisting, convoluted concurrency structure.
- Complexity (radon/lizard) only where it hides bugs; ruff in bulk by rule — never one
  finding per lint hit.
"""

[[categories]]
id = "dependencies"
title = "Dependencies & Supply Chain"
code = "DEP"
effort = 4
enabled = true
focus = """
Can the team rebuild exactly what runs in production, and is anything it ships known-vulnerable?
- Known vulnerabilities (triage pip-audit): is the vulnerable code path used, is a fix available?
- Reproducibility: unpinned or half-pinned runtime dependencies, missing lockfiles, base
  images not pinned to a version or digest.
- Runtime and framework lifecycle: language versions, base images and major framework
  versions past end of life or end of security support; deprecated APIs the code relies on.
- Weight and surface: several libraries doing the same job, packages declared but never
  imported or used only by dead code (runtime_signals.md), heavyweight packages for a
  small use, imported-but-undeclared packages.
- Build/deploy artifacts pulling from unverified sources.
"""

# ---------------------------------------------------------------------------
# Mandatory security KPIs (assessed one by one by the `security` specialist;
# rendered as report section 0.1). Status per KPI is one of:
#   open | partially_open | closed | not_applicable | not_verified
# ---------------------------------------------------------------------------

[[security_kpis]]
id = "KPI-01"
title = "No Rate Limiting on Authentication"
description = "Login, registration, OTP, password-reset and token-refresh endpoints must have per-IP and per-account throttling, attempt counters and lockout."
look_for = """
Every auth route (login/register/refresh/forgot/reset/verify-otp): is a rate
limiter decorator/middleware applied (slowapi, fastapi-limiter, nginx
config)? Per-IP only, or also per-account? Attempt counters / lockout in the
service layer? Is the limiter storage shared across workers (memory:// only
works per process)? Refresh endpoints without limits count.
"""

[[security_kpis]]
id = "KPI-02"
title = "Exposed Swagger/OpenAPI Documentation in Production"
description = "API docs (/docs, /redoc, /openapi.json) must be disabled or protected in production."
look_for = """
FastAPI(...)/app factories: docs_url, redoc_url, openapi_url — are they
disabled or gated on environment? Flask-RESTX/drf-spectacular/springdoc
equivalents. Reverse-proxy config blocking them.
"""

[[security_kpis]]
id = "KPI-03"
title = "Debug Endpoints Exposed in Production"
description = "No debug, test, demo, admin-bypass or introspection routes/tools may be reachable in production; DEBUG flags must default to off."
look_for = """
Routes with debug/test/demo/internal/dev in path or name, unauthenticated
health/info routes leaking versions/config, DEBUG=True defaults, framework
debug toolbars, uvicorn reload in prod, Streamlit/Gradio demo apps, stack
traces returned to clients, unsafe_allow_html in demo UIs.
"""

[[security_kpis]]
id = "KPI-04"
title = "Spreadsheet/CSV Formula Injection in Generated Content"
description = "Any content the system generates or derives (model output, chat, imports, user input) and writes to spreadsheets/CSV must neutralize formula prefixes (=, +, -, @, tab, CR)."
look_for = """
Any CSV/XLSX export (openpyxl, xlsxwriter, pandas.to_excel/to_csv, csv
module, SheetJS/xlsx, exceljs, papaparse unparse) whose cell values come from
anything not written by the developers: model output, chat, imports, user input. Is there escaping (prefix with ') of values
starting with = + - @ \\t \\r?
"""

[[security_kpis]]
id = "KPI-05"
title = "Stored XSS from User or Model-Generated Content"
description = "Stored content that a user, an import or a model produced (comments, profiles, documents, chat or model output) must never reach the DOM as raw HTML when rendered later."
look_for = """
dangerouslySetInnerHTML, v-html, innerHTML, markdown renderers with raw HTML
enabled (rehype-raw, marked without sanitize), iframes with srcdoc and
sandbox="allow-scripts allow-same-origin", Jinja |safe / Markup() on model
output, streamlit unsafe_allow_html, HTML emails built from model output
without escaping. Trace each stored user/import/model field to its render sites.
"""

[[security_kpis]]
id = "KPI-06"
title = "Unauthorized Access to Served Files (IDOR)"
description = "Every file/image download or static mount serving user content must enforce authentication and object-level authorization; paths must not be guessable."
look_for = """
StaticFiles/app.mount/send_file/FileResponse/serve_static of upload
directories; do app-level auth dependencies actually apply (mounted
sub-apps do NOT inherit FastAPI dependencies)? Is ownership checked for the
requested file id/path? Are filenames/IDs sequential or guessable? Signed
URLs with expiry?
"""

[[security_kpis]]
id = "KPI-07"
title = "Server File Path Disclosure"
description = "Error responses, logs returned to clients, and API payloads must not reveal absolute server paths or stack traces."
look_for = """
str(exc)/repr(exc)/traceback returned in HTTP responses (detail=str(e)),
FileNotFoundError/OSError messages passed through, absolute paths returned
in JSON (local_path, file_path fields), debug error pages, default exception
handlers leaking internals.
"""

[[security_kpis]]
id = "KPI-08"
title = "Content-Disposition Header Injection"
description = "Filenames placed in Content-Disposition (downloads, email attachments) must be sanitized (no CR/LF/quotes) and RFC 6266/5987 encoded."
look_for = """
Response headers built with f-strings from filenames
(f'attachment; filename="{name}"'), FileResponse(filename=user_value),
email MIMEBase add_header('Content-Disposition', ...) with user/LLM
controlled names, missing newline rejection / ASCII fallback.
"""

[[security_kpis]]
id = "KPI-09"
title = "Missing HTTP Security Headers"
description = "Responses must set HSTS, Content-Security-Policy, X-Content-Type-Options, Referrer-Policy, frame-ancestors/X-Frame-Options and Permissions-Policy (in app middleware or the reverse proxy)."
look_for = """
Security-header middleware (secure, starlette middleware, helmet, Django
SecurityMiddleware settings), nginx/ingress/Caddy configs in the repo, meta
CSP tags in the SPA index.html. Absence everywhere = open.
"""

[[security_kpis]]
id = "KPI-10"
title = "Internal IP Address Leakage"
description = "Internal hostnames, private IPs and localhost URLs must not leak via responses, generated links, emails, docs or logs shipped to clients."
look_for = """
Hardcoded 10.x/172.16-31.x/192.168.x/127.0.0.1/localhost/internal DNS names
in code defaults that end up in URLs sent to clients or emails, API docs,
error messages, response headers (Server/X-Powered-By/Via), CORS origin lists.
"""

[[security_kpis]]
id = "KPI-11"
title = "Content-Type Spoofing on File Upload"
description = "Uploads must be validated by content (magic bytes) and extension together, with a size cap enforced before the body is read."
look_for = """
UploadFile.content_type / request.files[...].mimetype / file.type used as the
only check, extension-or-content-type (either/or) logic, full await
file.read() before validation, no python-magic/filetype/puremagic sniffing,
no body-size limit at app or proxy level.
"""

[[security_kpis]]
id = "KPI-12"
title = "Unsafe Content in Stored-Data Exports"
description = "Stored user/customer/LLM fields exported to .xlsx/.csv must be neutralized for formulas and control characters, and HTML exports must be escaped."
look_for = """
Export code paths that read stored records (DB rows, saved chat, profiles)
and write them into spreadsheets or HTML reports: formula neutralization,
control-character stripping, HTML escaping of exported HTML tables.
"""
