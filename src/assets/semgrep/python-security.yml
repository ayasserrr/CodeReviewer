# Bundled Semgrep ruleset for the Static Analysis pipeline — same
# bundled-asset pattern as ruff.toml / pyrightconfig.json / gitleaks.
#
# Why bundled instead of `--config=auto`: `auto` downloads rules from
# semgrep.dev on every run, so a scan silently fails (exit code 2) whenever
# that host is unreachable (air-gapped servers, egress-restricted containers,
# semgrep.dev outages), and it also sends usage metrics. This file is
# project-owned (written for CodeReviewer, not copied from the Semgrep
# Registry, whose rules carry a license that restricts use inside a hosted
# review service), so scans are deterministic, offline and reproducible.
#
# Scope: high-signal Python security patterns. It is a SAST *seed* for the
# deep-review agents, not a replacement for them — the agents read the code
# and find what no pattern can (authorization logic, data flow across
# modules). Keep rules precise: every false positive here is noise an agent
# has to spend budget triaging.
#
# Point SEMGREP_CONFIG at another file/directory, or at "auto" / "p/python"
# (registry, needs network), to change what runs.

rules:
  # ---------------------------------------------------------------- injection
  - id: python-sql-injection-built-query
    languages: [python]
    severity: ERROR
    message: >-
      SQL query built with string formatting or concatenation reaches execute().
      Attacker-controlled values can change the query — use parameterized
      queries (placeholders + a params argument).
    metadata: {category: security, cwe: "CWE-89: SQL Injection", confidence: HIGH}
    # Taint mode, not statement patterns: it follows the built string through
    # variables and into nested blocks (e.g. `q = "..." % args` above an
    # `async with conn.cursor() as cur: await cur.execute(q)`), which a
    # `$Q = ... / ... / execute($Q)` sequence pattern does not.
    mode: taint
    pattern-sources:
      - patterns:
          - pattern-either:
              - pattern: '"..." % $ARGS'
              - pattern: '"...".format(...)'
              - pattern: f"...{$X}..."
              - pattern: '"..." + $X'
              - pattern: '$X + "..."'
          - pattern-not: '"..." + "..."'
    pattern-sinks:
      - patterns:
          - pattern-inside: $CUR.$EXEC($SINK, ...)
          - pattern: $SINK
          - metavariable-regex:
              metavariable: $EXEC
              regex: ^(execute|executemany|executescript|exec_driver_sql|fetch|fetchrow|fetchval|raw)$

  - id: python-sqlalchemy-text-built-query
    languages: [python]
    severity: ERROR
    message: >-
      sqlalchemy.text() built with string formatting or concatenation. Use bound
      parameters (text("... :name").bindparams(...) or execute(stmt, params)).
    metadata: {category: security, cwe: "CWE-89: SQL Injection", confidence: HIGH}
    pattern-either:
      - pattern: text(f"...")
      - pattern: text("..." % $ARGS)
      - pattern: text("...".format(...))
      - pattern: text("..." + $X)
      - pattern: sqlalchemy.text(f"...")

  - id: python-subprocess-shell-true
    languages: [python]
    severity: ERROR
    message: >-
      subprocess called with shell=True and a non-literal command. Untrusted
      input reaches a shell — pass an argument list with shell=False.
    metadata: {category: security, cwe: "CWE-78: OS Command Injection", confidence: MEDIUM}
    patterns:
      - pattern-either:
          - pattern: subprocess.$FN($CMD, ..., shell=True, ...)
      - pattern-not: subprocess.$FN("...", ..., shell=True, ...)
      - metavariable-regex:
          metavariable: $FN
          regex: ^(run|call|check_call|check_output|Popen|getoutput|getstatusoutput)$

  - id: python-os-system-non-literal
    languages: [python]
    severity: ERROR
    message: os.system / os.popen with a non-literal command — command injection risk. Use subprocess with an argument list.
    metadata: {category: security, cwe: "CWE-78: OS Command Injection", confidence: MEDIUM}
    patterns:
      - pattern-either:
          - pattern: os.system($CMD)
          - pattern: os.popen($CMD, ...)
      - pattern-not: os.system("...")
      - pattern-not: os.popen("...", ...)

  - id: python-eval-exec-non-literal
    languages: [python]
    severity: ERROR
    message: eval()/exec() on a non-literal value executes arbitrary code if the value is attacker-influenced.
    metadata: {category: security, cwe: "CWE-95: Eval Injection", confidence: MEDIUM}
    patterns:
      - pattern-either:
          - pattern: eval($X, ...)
          - pattern: exec($X, ...)
      - pattern-not: eval("...", ...)
      - pattern-not: exec("...", ...)

  - id: python-ssti-render-template-string
    languages: [python]
    severity: ERROR
    message: Template rendered from a non-literal string — server-side template injection if any part is user-controlled.
    metadata: {category: security, cwe: "CWE-1336: Template Injection", confidence: MEDIUM}
    patterns:
      - pattern-either:
          - pattern: render_template_string($T, ...)
          - pattern: flask.render_template_string($T, ...)
          - pattern: jinja2.Template($T, ...).render(...)
      - pattern-not: render_template_string("...", ...)
      - pattern-not: flask.render_template_string("...", ...)
      - pattern-not: jinja2.Template("...", ...).render(...)

  # --------------------------------------------------------- deserialization
  - id: python-unsafe-deserialization
    languages: [python]
    severity: ERROR
    message: >-
      Unsafe deserialization — pickle/marshal/shelve and yaml.load without a safe
      loader execute code embedded in the data. Use json, or yaml.safe_load.
    metadata: {category: security, cwe: "CWE-502: Deserialization of Untrusted Data", confidence: HIGH}
    pattern-either:
      - pattern: pickle.loads(...)
      - pattern: pickle.load(...)
      - pattern: cPickle.loads(...)
      - pattern: marshal.loads(...)
      - pattern: shelve.open(...)
      - pattern: dill.loads(...)
      - patterns:
          - pattern: yaml.load(...)
          - pattern-not: yaml.load(..., Loader=yaml.SafeLoader, ...)
          - pattern-not: yaml.load(..., Loader=yaml.CSafeLoader, ...)
          - pattern-not: yaml.load(..., Loader=SafeLoader, ...)
      - pattern: yaml.unsafe_load(...)

  # ------------------------------------------------------------------- XSS
  - id: python-jinja2-autoescape-disabled
    languages: [python]
    severity: ERROR
    message: Jinja2 autoescaping is disabled — any user-controlled value rendered into HTML becomes stored/reflected XSS.
    metadata: {category: security, cwe: "CWE-79: Cross-site Scripting", confidence: HIGH}
    pattern-either:
      - pattern: jinja2.Environment(..., autoescape=False, ...)
      - pattern: Environment(..., autoescape=False, ...)
      - pattern: aiohttp_jinja2.setup(..., autoescape=False, ...)
      - pattern: $TEMPLATES.env.autoescape = False

  - id: python-markupsafe-markup-non-literal
    languages: [python]
    severity: WARNING
    message: Markup() marks a non-literal string as safe HTML, bypassing autoescaping — XSS if it contains user input.
    metadata: {category: security, cwe: "CWE-79: Cross-site Scripting", confidence: LOW}
    patterns:
      - pattern-either:
          - pattern: Markup($X)
          - pattern: markupsafe.Markup($X)
      - pattern-not: Markup("...")
      - pattern-not: markupsafe.Markup("...")

  # ----------------------------------------------------------------- crypto
  - id: python-weak-hash
    languages: [python]
    severity: WARNING
    message: MD5/SHA-1 are broken for security use (passwords, signatures, tokens). Use bcrypt/argon2 for passwords, SHA-256+ / HMAC otherwise.
    metadata: {category: security, cwe: "CWE-327: Broken Cryptographic Algorithm", confidence: MEDIUM}
    patterns:
      - pattern-either:
          - pattern: hashlib.md5(...)
          - pattern: hashlib.sha1(...)
          - pattern: md5(...)
          - pattern: sha1(...)
          - pattern: hashlib.new("md5", ...)
          - pattern: hashlib.new("sha1", ...)
      - pattern-not: hashlib.md5(..., usedforsecurity=False, ...)
      - pattern-not: hashlib.sha1(..., usedforsecurity=False, ...)

  - id: python-insecure-random-for-secrets
    languages: [python]
    severity: WARNING
    message: The random module is not cryptographically secure — use secrets for tokens, passwords, OTPs and session ids.
    metadata: {category: security, cwe: "CWE-338: Weak PRNG", confidence: LOW}
    patterns:
      - pattern-either:
          - pattern: $VAR = random.$FN(...)
      - metavariable-regex:
          metavariable: $VAR
          regex: (?i).*(token|secret|password|passwd|otp|nonce|salt|session|api_?key).*

  # -------------------------------------------------------------- transport
  - id: python-tls-verification-disabled
    languages: [python]
    severity: ERROR
    message: TLS certificate verification disabled — traffic can be intercepted (MITM).
    metadata: {category: security, cwe: "CWE-295: Improper Certificate Validation", confidence: HIGH}
    pattern-either:
      - pattern: requests.$M(..., verify=False, ...)
      - pattern: httpx.$M(..., verify=False, ...)
      - pattern: httpx.Client(..., verify=False, ...)
      - pattern: httpx.AsyncClient(..., verify=False, ...)
      - pattern: ssl._create_unverified_context(...)
      - pattern: aiohttp.TCPConnector(..., ssl=False, ...)

  - id: python-jwt-verification-disabled
    languages: [python]
    severity: ERROR
    message: JWT decoded without signature verification — any forged token is accepted.
    metadata: {category: security, cwe: "CWE-347: Improper Verification of Cryptographic Signature", confidence: HIGH}
    pattern-either:
      - pattern: 'jwt.decode(..., options={..., "verify_signature": False, ...}, ...)'
      - pattern: jwt.decode(..., verify=False, ...)

  # --------------------------------------------------------- configuration
  - id: python-debug-enabled
    languages: [python]
    severity: WARNING
    message: Debug mode enabled in code — leaks stack traces and internals, and some frameworks expose an interactive console.
    metadata: {category: security, cwe: "CWE-489: Active Debug Code", confidence: MEDIUM}
    pattern-either:
      - pattern: $APP.run(..., debug=True, ...)
      - pattern: aiohttp.web.Application(..., debug=True, ...)
      - pattern: Application(..., debug=True, ...)
      - pattern: FastAPI(..., debug=True, ...)
      - pattern: uvicorn.run(..., reload=True, ...)
      - pattern: DEBUG = True

  - id: python-cors-wildcard-with-credentials
    languages: [python]
    severity: ERROR
    message: CORS allows any origin together with credentials — any website can make authenticated requests on a user's behalf.
    metadata: {category: security, cwe: "CWE-942: Permissive CORS Policy", confidence: HIGH}
    pattern-either:
      - pattern: $APP.add_middleware(CORSMiddleware, ..., allow_origins=["*"], ..., allow_credentials=True, ...)
      - pattern: $APP.add_middleware(CORSMiddleware, ..., allow_credentials=True, ..., allow_origins=["*"], ...)
      - pattern: CORS($APP, ..., supports_credentials=True, ...)

  - id: python-hardcoded-secret
    languages: [python]
    severity: WARNING
    message: A secret appears to be hard-coded in source. Load it from the environment or a secret manager.
    metadata: {category: security, cwe: "CWE-798: Hard-coded Credentials", confidence: LOW}
    patterns:
      - pattern-either:
          - pattern: $VAR = "$VALUE"
          - pattern: $FN(..., $VAR="$VALUE", ...)
      - metavariable-regex:
          metavariable: $VAR
          regex: (?i)^[a-z_]*(password|passwd|secret|secret_key|api_key|apikey|access_token|auth_token|private_key)$
      - metavariable-regex:
          metavariable: $VALUE
          regex: ^(?!(?i:changeme|change-me|xxx+|\*+|example|dummy|test|placeholder|your[-_].*|<.*>|\$\{.*\})$).{8,}$

  # ------------------------------------------------------------- filesystem
  - id: python-tempfile-mktemp
    languages: [python]
    severity: WARNING
    message: tempfile.mktemp() is race-prone (another process can create the file first). Use mkstemp() / NamedTemporaryFile().
    metadata: {category: security, cwe: "CWE-377: Insecure Temporary File", confidence: HIGH}
    pattern: tempfile.mktemp(...)

  - id: python-xml-external-entities
    languages: [python]
    severity: WARNING
    message: >-
      Standard-library XML parser on possibly untrusted input. Python's stdlib parsers do NOT
      resolve external entities (no file read / SSRF), and expat >= 2.4.1 limits entity
      expansion — the residual risk is resource exhaustion on hostile input, so it matters
      only when the XML comes from users (uploads) rather than a trusted upstream API.
    metadata: {category: security, cwe: "CWE-776: XML Entity Expansion", confidence: LOW}
    pattern-either:
      - pattern: xml.etree.ElementTree.parse(...)
      - pattern: xml.etree.ElementTree.fromstring(...)
      - pattern: ET.parse(...)
      - pattern: ET.fromstring(...)
      - pattern: xml.dom.minidom.parseString(...)
      - pattern: xml.sax.parseString(...)

  - id: python-upload-filename-path-traversal
    languages: [python]
    severity: ERROR
    message: >-
      A client-supplied upload filename reaches a filesystem path. "../" segments or an
      absolute name can write/read outside the intended directory. Take only the basename
      (or generate the name server-side).
    metadata: {category: security, cwe: "CWE-22: Path Traversal", confidence: MEDIUM}
    mode: taint
    pattern-sources:
      - pattern: $F.filename
    pattern-sanitizers:
      - pattern: os.path.basename(...)
      - pattern: secure_filename(...)
      - pattern: Path(...).name
      - pattern: pathlib.Path(...).name
      - pattern: uuid.uuid4()
    pattern-sinks:
      - pattern: open(...)
      - pattern: os.path.join(...)
      - pattern: Path(...)
      - pattern: pathlib.Path(...)
      - pattern: $P / $X
      - pattern: shutil.$FN(...)
      - pattern: os.rename(...)
      - pattern: os.replace(...)
      - pattern: aiofiles.open(...)

  - id: python-exception-text-returned-to-client
    languages: [python]
    severity: WARNING
    message: >-
      Raw exception text is placed in a response/response model. OS and library errors
      carry absolute server paths, SQL and internal hostnames (information disclosure).
    metadata: {category: security, cwe: "CWE-209: Information Exposure Through an Error Message", confidence: MEDIUM}
    patterns:
      - pattern-inside: |
          try:
              ...
          except $EXC as $E:
              ...
      - pattern-either:
          - pattern: HTTPException(..., detail=str($E), ...)
          - pattern: HTTPException(..., detail=f"...{$E}...", ...)
          - pattern: 'JSONResponse(..., content={..., $K: str($E), ...}, ...)'
          - pattern: 'return {..., $K: str($E), ...}'
          - pattern: $MODEL(..., error=str($E), ...)
          - pattern: $MODEL(..., detail=str($E), ...)
          - pattern: $MODEL(..., message=str($E), ...)

  - id: python-http-request-without-timeout
    languages: [python]
    severity: WARNING
    message: Outbound HTTP call without a timeout — a slow or hung upstream blocks this worker indefinitely.
    metadata: {category: reliability, cwe: "CWE-400: Uncontrolled Resource Consumption", confidence: HIGH}
    patterns:
      - pattern-either:
          - pattern: requests.$M(...)
          - pattern: httpx.$M(...)
      - metavariable-regex:
          metavariable: $M
          regex: ^(get|post|put|patch|delete|head|request)$
      - pattern-not: requests.$M(..., timeout=$T, ...)
      - pattern-not: httpx.$M(..., timeout=$T, ...)

  - id: python-blocking-call-in-async-def
    languages: [python]
    severity: WARNING
    message: >-
      Blocking call directly inside an async function — it stalls the event loop and every
      other request on this worker. Use the async equivalent or asyncio.to_thread().
    metadata: {category: performance, cwe: "CWE-400: Uncontrolled Resource Consumption", confidence: HIGH}
    patterns:
      - pattern-inside: |
          async def $FUNC(...):
              ...
      - pattern-not-inside: |
          def $INNER(...):
              ...
      - pattern-either:
          - pattern: time.sleep(...)
          - pattern: requests.$M(...)
          - pattern: subprocess.run(...)
          - pattern: subprocess.check_output(...)
          - pattern: subprocess.call(...)

  - id: python-static-files-mount
    languages: [python]
    severity: WARNING
    message: >-
      StaticFiles is mounted as a sub-application. App-level and router-level FastAPI
      dependencies (API keys, auth) do NOT apply to mounted sub-apps — every file under this
      directory is public unless something else guards the path.
    metadata: {category: security, cwe: "CWE-639: Authorization Bypass Through User-Controlled Key", confidence: MEDIUM}
    pattern: $APP.mount($PATH, StaticFiles(...), ...)

  - id: python-insecure-secret-default
    languages: [python]
    severity: ERROR
    message: >-
      A secret falls back to a hard-coded default when the environment variable is missing,
      so a misconfigured deployment boots with a publicly known secret (fails open).
    metadata: {category: security, cwe: "CWE-1188: Insecure Default Initialization", confidence: HIGH}
    patterns:
      - pattern-either:
          - pattern: os.getenv("$KEY", "$DEFAULT")
          - pattern: os.environ.get("$KEY", "$DEFAULT")
      - metavariable-regex:
          metavariable: $KEY
          regex: (?i).*(secret|password|passwd|api_key|apikey|token|private_key|signing_key).*
      - metavariable-regex:
          metavariable: $DEFAULT
          regex: .+

  - id: python-streamlit-unsafe-html
    languages: [python]
    severity: WARNING
    message: Streamlit renders this content as raw HTML — model or user text reaching it is an XSS vector.
    metadata: {category: security, cwe: "CWE-79: Cross-site Scripting", confidence: MEDIUM}
    pattern: $ST.$FN(..., unsafe_allow_html=True, ...)

  - id: python-spreadsheet-export
    languages: [python]
    severity: INFO
    message: >-
      Data is written to a spreadsheet/CSV. Cell values starting with = + - @ (or tab/CR) run as
      formulas when opened — check that stored, user or LLM-derived values are neutralized.
    metadata: {category: security, cwe: "CWE-1236: CSV/Formula Injection", confidence: LOW}
    pattern-either:
      - pattern: $DF.to_excel(...)
      - pattern: $DF.to_csv(...)
      - pattern: csv.writer(...)
      - pattern: csv.DictWriter(...)
      - pattern: openpyxl.Workbook(...)
      - pattern: xlsxwriter.Workbook(...)

  - id: python-content-disposition-header
    languages: [python]
    severity: INFO
    message: >-
      A Content-Disposition header is built here (download or email attachment). A filename with
      CR/LF or quotes can inject headers — check that user/LLM-controlled names are sanitized and
      RFC 6266/5987 encoded.
    metadata: {category: security, cwe: "CWE-113: HTTP Response Splitting", confidence: LOW}
    pattern-either:
      - pattern: $MSG.add_header("Content-Disposition", ...)
      - pattern: $MSG.add_header('Content-Disposition', ...)
      - pattern: FileResponse(..., filename=$NAME, ...)
      - pattern: '$H["Content-Disposition"] = $V'
      - pattern: 'Response(..., headers={..., "Content-Disposition": $V, ...}, ...)'

  # ------------------------------------------------------ data-integrity leads
  # Leads for the correctness lane (not verdicts): shapes behind real pipeline bugs.
  - id: python-silent-value-substitution
    languages: [python]
    severity: INFO
    message: >-
      Extracted text is rewritten with the current date/year inside a regex substitution —
      check that real data (e.g. a graduation year) is not silently "corrected" into a
      different value that downstream scoring then trusts.
    metadata: {category: correctness, cwe: "CWE-1284: Improper Validation of Specified Quantity in Input", confidence: LOW}
    patterns:
      - pattern-inside: |
          def $F(...):
              ...
      - pattern-either:
          - pattern-inside: |
              $Y = datetime.now().year
              ...
          - pattern-inside: |
              $Y = datetime.datetime.now().year
              ...
          - pattern-inside: |
              $Y = date.today().year
              ...
      - pattern: re.sub(...)

  - id: python-random-identifier
    languages: [python]
    severity: INFO
    message: >-
      An identifier is generated with the non-cryptographic `random` module in a small space —
      check for collisions (birthday bound), whether the ID's shape is used as meaning
      elsewhere, and whether it is guessable where it matters.
    metadata: {category: correctness, cwe: "CWE-330: Use of Insufficiently Random Values", confidence: LOW}
    patterns:
      - pattern-either:
          - pattern: random.randint(...)
          - pattern: random.choice(...)
          - pattern: random.choices(...)
          - pattern: random.random()
      - pattern-either:
          - patterns:
              - pattern-inside: |
                  def $F(...):
                      ...
              - metavariable-regex:
                  metavariable: $F
                  regex: (?i).*(_id|id_|^id|identifier|uid|key|code|token|filename|name).*
          - patterns:
              - pattern-inside: $V = ...
              - metavariable-regex:
                  metavariable: $V
                  regex: (?i).*(_id|^id|identifier|uid|key|code|token|filename).*

  - id: python-claim-flag-or-lock
    languages: [python]
    severity: INFO
    message: >-
      A work claim / lock / in-progress flag is taken here. Check that it is released on
      EVERY failure path (exception, cancellation, crash, redeploy) — a flag released only
      by the happy path or by a background task blocks all later work forever unless it
      has a TTL or reaper.
    metadata: {category: correctness, cwe: "CWE-667: Improper Locking", confidence: LOW}
    patterns:
      - pattern-either:
          - pattern: $F(...)
          - pattern: $O.$F(...)
      - metavariable-regex:
          metavariable: $F
          regex: (?i)^(try_)?(mark|set|claim|acquire|start|begin)_?.*(in_progress|lock|locked|running|busy|processing)$

  # ------------------------------------------------- architecture / LLM leads
  - id: python-langgraph-compile-without-checkpointer
    languages: [python]
    severity: INFO
    message: >-
      A LangGraph graph is compiled without a checkpointer — conversation state is not persisted
      between invocations. Check whether callers resend history; if not, every chat turn is stateless.
    metadata: {category: llm, confidence: LOW}
    patterns:
      - pattern: $B.compile()
      - pattern-inside: |
          $B = StateGraph(...)
          ...

  - id: python-model-call-in-loop
    languages: [python]
    severity: INFO
    message: >-
      A model / embedding call inside a loop — latency and cost scale with the collection size.
      Check whether the loop runs over a growing pool (every candidate, every document) on each request
      or upload, whether results could be batched or cached, and whether it blocks the event loop.
    metadata: {category: performance, confidence: LOW}
    patterns:
      - pattern-either:
          - pattern-inside: |
              for $X in $Y:
                  ...
          - pattern-inside: |
              async for $X in $Y:
                  ...
          - pattern-inside: |
              [... for $X in $Y]
      - pattern-either:
          - pattern: $M.generate(...)
          - pattern: $M.invoke(...)
          - pattern: await $M.ainvoke(...)
          - pattern: $M.predict(...)
          - pattern: $M.encode(...)
          - pattern: $M.embed_query(...)
          - pattern: $M.embed_documents(...)
          - pattern: $M.chat.completions.create(...)
      - metavariable-regex:
          metavariable: $M
          regex: (?i).*(llm|model|client|chain|agent|embed|encoder|openai|watson|gemini|claude|gpt).*

  - id: python-local-vector-store
    languages: [python]
    severity: INFO
    message: >-
      A vector store persisted to local disk — single-writer, per-machine state: two instances or workers
      cannot share it safely, and it is lost with the container unless the path is on a volume.
    metadata: {category: performance, confidence: LOW}
    pattern-either:
      - pattern: Chroma(..., persist_directory=$D, ...)
      - pattern: chromadb.PersistentClient(...)
      - pattern: FAISS.load_local(...)
      - pattern: $F.save_local(...)
