[project]
name = "CodeReviewer"
version = "1.0.0"
description = "A code review tool for developers"
authors = [
    { name = "Aya Yasser", email = "ayasser.tawfik@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.13"
License = { file = "LICENSE" }  
keywords = ["code review", "developer tools"]
dependencies = [
    "alembic>=1.13",
    "asyncpg>=0.29",
    "bcrypt>=4.0,<4.1",  # passlib 1.7.4 reads bcrypt.__about__, removed in bcrypt 4.1+
    "colorama>=0.4.6; sys_platform == 'win32'",
    "concurrent-log-handler>=0.9.29",
    "email-validator>=2.0",
    "fastapi>=0.115",
    "httpx>=0.28.1",
    "langgraph>=1.2.12",
    "passlib[bcrypt]>=1.7.4",
    "psycopg[binary]>=3.1",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.8",
    "slowapi>=0.1.9",
    "sqlalchemy[asyncio]>=2.0.36",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.30",
    "uvloop>=0.19; sys_platform != 'win32'",
]

[project.urls]
Repository = ""

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-mock>=3.15.1",
]
